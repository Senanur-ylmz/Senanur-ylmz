<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E3AE46" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#E3AE46" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#96601F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#96601F" stop-opacity="0"/>
    </linearGradient>
    <g id="d-flower">
      <g fill="#E8B84F">
        <ellipse cx="0" cy="-5" rx="3" ry="5"/>
        <ellipse cx="0" cy="-5" rx="3" ry="5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-5" rx="3" ry="5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-5" rx="3" ry="5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-5" rx="3" ry="5" transform="rotate(288)"/>
      </g>
      <circle r="2.2" fill="#6C3C18"/>
    </g>
    <path id="d-spark" d="M0,-7 Q1,-1 7,0 Q1,1 0,7 Q-1,1 -7,0 Q-1,-1 0,-7 Z" fill="#C9922E"/>
  </defs>

  <rect x="60" y="19" width="780" height="2" rx="1" fill="url(#line)"/>

  <use href="#d-flower" transform="translate(450,20) scale(1.35)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" additive="sum"/>
  </use>
  <use href="#d-flower" transform="translate(390,20) scale(0.85)"/>
  <use href="#d-flower" transform="translate(510,20) scale(0.85)"/>

  <use href="#d-spark" transform="translate(320,20) scale(0.5)"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0s"   repeatCount="indefinite"/></use>
  <use href="#d-spark" transform="translate(580,20) scale(0.5)"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.8s" repeatCount="indefinite"/></use>
  <use href="#d-spark" transform="translate(240,20) scale(0.38)"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></use>
  <use href="#d-spark" transform="translate(660,20) scale(0.38)"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></use>
</svg>
