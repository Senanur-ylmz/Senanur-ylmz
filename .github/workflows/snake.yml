name: snake

# Draws the contribution grid as a snake animation and parks the SVGs on the
# `output` branch, so the README pulls them from this repo rather than from a
# third-party renderer.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8FC5&color_dots=#3A2431,#5C2F45,#8E3A63,#C25689,#FF8FC5
            dist/snake-light.svg?palette=github-light&color_snake=#E75BA0&color_dots=#FBE4EF,#F6C3DC,#EE9BC4,#E86FA8,#D6478E

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
