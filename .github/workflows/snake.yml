name: snake

# Draws the contribution grid as a snake animation and parks the SVGs on the
# `output` branch, so the README pulls them from this repo rather than from a
# third-party renderer.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8B84F&color_dots=#3D2C15,#5E4520,#8A6528,#C08F35,#E8B84F
            dist/snake-light.svg?palette=github-light&color_snake=#96601F&color_dots=#FAF0DA,#F0DCB0,#E0BE72,#C09240,#96601F

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
