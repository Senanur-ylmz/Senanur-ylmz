name: snake

# Draws the contribution grid as a snake animation and parks the SVGs on the
# `output` branch, so the README pulls them from this repo rather than from a
# third-party renderer.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#B98BE8&color_dots=#2C1E45,#472F70,#6B39A8,#9760D6,#B98BE8
            dist/snake-light.svg?palette=github-light&color_snake=#6B39A8&color_dots=#EFE6FA,#D9C2F2,#B98BE8,#8E5BC9,#6B39A8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
